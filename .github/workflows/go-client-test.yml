name: Go client Test

# Vet and tests. Nothing to publish: a Go module is consumed straight from the tag.
on:
  push:
    branches: [main]
    paths:
      - 'clients/go/**'
      - '.github/workflows/go-client-test.yml'
  pull_request:
    paths:
      - 'clients/go/**'
      - '.github/workflows/go-client-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-client-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: clients/go

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # No dependency to cache: the client imports nothing outside the stdlib, so there is no go.sum.
          cache: false

      # The client is stdlib-only, so gofmt and vet are the whole lint story — no external linter.
      - name: Check the formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt -w these:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...

      # -race: the client batches on its own goroutine while the caller keeps posting.
      - run: go test -race -count=1 ./...
