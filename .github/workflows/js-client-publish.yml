name: JS client Publish

# Releases @vapolia/analytics to npm.
#
# Publish a GitHub release whose tag is the version, which must match the one in package.json:
#   gh release create js-v1.0.1 --title "JS client 1.0.1" --notes "..."
#
# Tick "Set as a pre-release" for a beta. Its version must then carry a semver prerelease suffix
# (js-v1.1.0-beta.1), and it goes out under the `next` dist-tag: without that, npm would move `latest`
# onto the beta and serve it to everyone running `npm i @vapolia/analytics`.
#
# A release is the only trigger: the version check below has nothing to compare against otherwise,
# and a failed run is re-run from its own page.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # npm provenance

concurrency:
  group: js-publish
  cancel-in-progress: false

defaults:
  run:
    working-directory: clients/js

jobs:
  publish:
    runs-on: ubuntu-latest

    # A release event carries no tag filter, unlike a tag push, so every client's workflow wakes on
    # every release of this repository. This is what keeps each one to its own.
    if: startsWith(github.event.release.tag_name, 'js-v')

    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: clients/js/pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      # The two mistakes this catches: a beta published as the stable one, and a stable release
      # carrying a suffix that would send it to the `next` dist-tag and never to `latest`.
      - name: Check the tag against package.json
        id: version
        run: |
          declared=$(node -p "require('./package.json').version")
          tagged="${TAG#js-v}"
          if [ "$declared" != "$tagged" ]; then
            echo "tag $TAG says $tagged, package.json says $declared" >&2
            exit 1
          fi

          case "$declared" in *-*) suffixed=true ;; *) suffixed=false ;; esac
          if [ "$PRERELEASE" != "$suffixed" ]; then
            echo "the release is marked prerelease=$PRERELEASE, and $declared has a suffix: $suffixed" >&2
            echo "a pre-release needs a suffix (1.1.0-beta.1); a release must not carry one" >&2
            exit 1
          fi

          if [ "$PRERELEASE" = "true" ]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "publishing $declared"

      # A version is published once and cannot be taken back, so the whole check runs here too rather
      # than trusting that the build workflow saw this exact commit.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

      # --provenance signs the package with this workflow run; it needs the public repository and id-token above.
      - run: npm publish --access public --provenance --ignore-scripts --tag ${{ steps.version.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
