name: .NET client Test

on:
  push:
    branches: [main]
    paths:
      - 'clients/dotnet/**'
      - '.github/workflows/dotnet-client-test.yml'
  pull_request:
    paths:
      - 'clients/dotnet/**'
      - '.github/workflows/dotnet-client-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-client-${{ github.ref }}
  cancel-in-progress: true

env:
  CLIENT: clients/dotnet/Vapolia.Analytics.Client/Vapolia.Analytics.Client.csproj
  ASPNETCORE: clients/dotnet/Vapolia.Analytics.Client.AspNetCore/Vapolia.Analytics.Client.AspNetCore.csproj
  TESTS: clients/dotnet/Vapolia.Analytics.Client.Tests/Vapolia.Analytics.Client.Tests.csproj

jobs:
  test:
    # Restoring the project evaluates every TargetFrameworks entry regardless of -f, so every
    # workload it declares must be installed before any build, even one scoped to a single TFM.
    # windows-latest carries all of android/ios/maccatalyst, unlike ubuntu (no ios/maccatalyst) or
    # macOS (no windows SDK) — so it is the only runner that can build this project in one job.
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet workload install android ios maccatalyst --skip-sign-check

      - name: Build every target
        run: |
          dotnet build $CLIENT -c Release
          dotnet build $ASPNETCORE -c Release

      # MTP: run the test project, do not `dotnet test` it.
      - name: Test
        run: dotnet run --project $TESTS -c Release
