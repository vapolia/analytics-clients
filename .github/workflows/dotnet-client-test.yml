name: .NET client Test

on:
  push:
    branches: [main]
    paths:
      - 'clients/dotnet/**'
      - '.github/workflows/dotnet-client-test.yml'
  pull_request:
    paths:
      - 'clients/dotnet/**'
      - '.github/workflows/dotnet-client-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-client-${{ github.ref }}
  cancel-in-progress: true

env:
  CLIENT: clients/dotnet/Vapolia.Analytics.Client/Vapolia.Analytics.Client.csproj
  ASPNETCORE: clients/dotnet/Vapolia.Analytics.Client.AspNetCore/Vapolia.Analytics.Client.AspNetCore.csproj
  TESTS: clients/dotnet/Vapolia.Analytics.Client.Tests/Vapolia.Analytics.Client.Tests.csproj

jobs:
  server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # A library: the TFMs build from reference assemblies alone, no Xcode needed
      - run: dotnet workload install android ios maccatalyst --skip-sign-check

      - name: Build every target
        run: |
          dotnet build $CLIENT -c Release
          dotnet build $ASPNETCORE -c Release

      # MTP: run the test project, do not `dotnet test` it.
      - name: Test
        run: dotnet run --project $TESTS -c Release
