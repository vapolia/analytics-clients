name: Kotlin client Test

on:
  push:
    branches: [main]
    paths:
      - 'clients/kotlin/**'
      - '.github/workflows/kotlin-client-test.yml'
  pull_request:
    paths:
      - 'clients/kotlin/**'
      - '.github/workflows/kotlin-client-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotlin-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clients/kotlin

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # A pull request may read the cache the branch built, but never write to it.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Test
        run: ./gradlew :analytics:testDebugUnitTest --console=plain

      - name: Build the AAR
        run: ./gradlew :analytics:assembleRelease --console=plain

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-test-report
          path: clients/kotlin/analytics/build/reports/tests/
          retention-days: 3
