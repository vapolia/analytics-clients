name: .NET client Publish

# Releases Vapolia.Analytics.Client to NuGet
#
# The matching trusted-publishing policy has to exist on nuget.org:
#   Repository Owner: vapolia   Repository: analytics   Workflow File: dotnet-client-publish.yml
#
# Publish a GitHub release whose tag is the version:
#   gh release create dotnet-v1.0.1 --title "dotnet client 1.0.1" --notes "..."
#
# Tick "Set as a pre-release" for a beta. Its version must then carry a suffix (dotnet-v1.1.0-beta.1),
# which is the whole mechanism on nuget.org: a suffixed version is hidden unless a consumer asks for
# prereleases (`dotnet add package --prerelease`). There is no dist-tag to set.
#
# A release is the only trigger: the version check below has nothing to compare against otherwise,
# and a failed run is re-run from its own page.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: dotnet-publish
  cancel-in-progress: false

env:
  CLIENT: clients/dotnet/Vapolia.Analytics.Client/Vapolia.Analytics.Client.csproj
  ASPNETCORE: clients/dotnet/Vapolia.Analytics.Client.AspNetCore/Vapolia.Analytics.Client.AspNetCore.csproj
  TESTS: clients/dotnet/Vapolia.Analytics.Client.Tests/Vapolia.Analytics.Client.Tests.csproj

jobs:
  publish:
    # Restoring the project evaluates every TargetFrameworks entry, so android/ios/maccatalyst all
    # need their workload installed to pack any TFM. windows-latest is the one runner that has
    # all three installable (unlike ubuntu, which lacks ios/maccatalyst).
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    # A release event carries no tag filter, unlike a tag push, so every client's workflow wakes on
    # every release of this repository. This is what keeps each one to its own.
    if: startsWith(github.event.release.tag_name, 'dotnet-v')

    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}

    permissions:
      contents: read
      id-token: write # lets this job ask GitHub for the OIDC token nuget.org validates

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Derive the version from the tag
        run: |
          version="${TAG#dotnet-v}"

          # nuget.org is immutable: a version pushed is a version spent, so a beta published without
          # its suffix cannot be taken back and reissued as the stable one.
          case "$version" in *-*) suffixed=true ;; *) suffixed=false ;; esac
          if [ "$PRERELEASE" != "$suffixed" ]; then
            echo "the release is marked prerelease=$PRERELEASE, and $version has a suffix: $suffixed" >&2
            echo "a pre-release needs a suffix (1.1.0-beta.1); a release must not carry one" >&2
            exit 1
          fi
          echo "publishing $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: dotnet workload install android ios maccatalyst --skip-sign-check

      # A version is published once and cannot be taken back, so the tests run here too.
      - name: Test
        run: dotnet run --project $TESTS -c Release

      # Two packages: the app half, and the ASP.NET Core half that depends on it.
      # /p:Version overrides the <Version> in the csproj, so the tag is the single source of truth.
      # pwsh, not the job's bash: MSYS rewrites the leading slash into a path, and dotnet then reads
      # it as a second project.
      - name: Pack
        shell: pwsh
        run: |
          dotnet pack $env:CLIENT -c Release -o artifacts "/p:Version=$env:VERSION"
          dotnet pack $env:ASPNETCORE -c Release -o artifacts "/p:Version=$env:VERSION"

      - name: NuGet login OIDC
        id: login
        uses: NuGet/login@v1
        with:
          user: vapolia

      - name: Push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate
