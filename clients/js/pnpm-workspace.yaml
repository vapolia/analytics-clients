# Forces patched versions of vulnerable transitive deps pulled in by react-native's and expo's own
# tooling — dev-time only, never shipped in the package.
overrides:
  image-size: '>=2.0.3'
  uuid: '>=11.1.1'
  vite: '>=8.3.3'
  brace-expansion: '>=5.0.12'
  source-map-js: '>=1.2.2'
  shell-quote: '>=1.11.0'
